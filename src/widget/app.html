<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Customer orders</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2430; --muted: #6b7280; --line: #e5e7eb;
    --row-alt: #f6f7fb; --row-hover: #eef2ff;
    --head-a: #6d5dfc; --head-b: #c86dd7; --head-fg: #ffffff;
    --chip-bg: #fff4e5; --chip-fg: #9a4b00;
    --total-bg: #ecfdf5; --total-fg: #065f46;
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #15171e; --fg: #e8eaf1; --muted: #9aa3b2; --line: #2a2f3a;
    --row-alt: #1b1e27; --row-hover: #262b3a;
    --head-a: #5b4bd6; --head-b: #a455b8; --head-fg: #ffffff;
    --chip-bg: #3a2a12; --chip-fg: #ffd59e;
    --total-bg: #0f2f26; --total-fg: #9ff2cf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; color: var(--head-fg); background: linear-gradient(120deg, var(--head-a), var(--head-b)); }
  .head h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .head .sub { opacity: .9; font-size: 12px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters span { background: rgba(255,255,255,.22); padding: 2px 9px; border-radius: 999px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); border-bottom: 1px solid var(--line); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.id { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); font-size: 12px; font-weight: 600; }
  .emoji { font-size: 16px; margin-right: 6px; }
  .totals { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .totals span { background: var(--total-bg); color: var(--total-fg); padding: 4px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
  <main id="root" class="card"><div class="empty">Loading…</div></main>
  <script type="module" src="./app.ts"></script>
</body>
</html>
